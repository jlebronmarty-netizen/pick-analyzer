name: NHL exact Circa line research safety

on:
  pull_request:
    paths:
      - 'src/lib/nhl-exact-circa-market-research.mjs'
      - 'src/lib/nhl-late-v6-core.mjs'
      - 'src/services/nhl-exact-circa-market-research.service.ts'
      - 'src/app/api/nhl/exact-circa-market-research/route.ts'
      - 'tests/nhl-exact-circa-market-research.test.mjs'
      - '.github/workflows/nhl-exact-circa-markets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Exact line scoring, V6 and historical NHL safety
        run: node --test tests/nhl-exact-circa-market-research.test.mjs tests/nhl-v6-late-probable-calibration.test.mjs tests/nhl-v6-paired-validation.test.mjs tests/nhl-free-circa-main-markets-20261115.test.mjs
      - name: TypeScript safety
        run: npx tsc --noEmit --pretty false
