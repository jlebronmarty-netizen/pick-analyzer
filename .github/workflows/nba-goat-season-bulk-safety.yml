name: NBA GOAT 2026 bulk archive safety
on:
  pull_request:
    paths:
      - 'scripts/nba-goat-season-2026-bulk-archive.mjs'
      - 'supabase/migrations/20261114160000_nba_goat_season_archive_v1.sql'
      - 'docs/NBA_GOAT_2026_FULL_SEASON_BULK_ARCHIVE.md'
      - '.github/workflows/nba-goat-season-bulk-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-provider-call-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Syntax validation
        run: node --check scripts/nba-goat-season-2026-bulk-archive.mjs
      - name: Ensure no-call dry-run with no credentials
        run: node scripts/nba-goat-season-2026-bulk-archive.mjs --mode=core --max-requests=30 --max-games=3
