name: MLB SBR F5 Historical Sample Audit

on:
  pull_request:
    paths:
      - 'scripts/research/sbr-mlb-f5-historical-audit.py'
      - '.github/workflows/mlb-sbr-f5-historical-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned audit dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'requests>=2.32,<3'

      - name: Probe one F5 game through public GraphQL without recording odds values
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research/sbr-mlb-f5-historical-audit.py tmp/sbr-f5-historical-audit.json --schema-only

      - name: Enforce one-request schema-only boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs')
          const p=JSON.parse(fs.readFileSync('tmp/sbr-f5-historical-audit.json','utf8'))
          if(p.researchOnly!==true) throw new Error('research boundary')
          if(p.rawPayloadPersisted!==false) throw new Error('raw persistence forbidden')
          if(p.subscriptionCreditsConsumed!==0) throw new Error('credit spend forbidden')
          if(p.providerRequestsMade!==3) throw new Error('probe must make exactly three requests')
          if(p.gameIdResolved!==true) throw new Error('game id missing')
          if(!p.currentLines || !p.openingLines) throw new Error('line schema summaries missing')
          console.log(JSON.stringify({
            games:p.games,
            oddsViewsAllNull:p.oddsViewsAllNull,
            currentLines:p.currentLines,
            openingLines:p.openingLines,
          },null,2))
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: mlb-sbr-f5-historical-audit
          path: tmp/sbr-f5-historical-audit.json
          retention-days: 7
          if-no-files-found: error
