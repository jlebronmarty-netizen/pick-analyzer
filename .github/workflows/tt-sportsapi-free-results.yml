name: Table Tennis SportsAPI free results safety

on:
  pull_request:
    paths:
      - 'src/lib/edge-lab/tt-sportsapi-results.mjs'
      - 'src/lib/edge-lab/tt-sportsapi-client.mjs'
      - 'src/services/edge-lab-multi.service.mjs'
      - 'tests/tt-sportsapi-free-results.test.mjs'
      - 'src/lib/edge-lab/tt-odd-even-baseline.mjs'
      - 'tests/tt-odd-even-baseline.test.mjs'
      - 'src/app/edge-lab/board.jsx'
      - 'src/components/dashboard/SportDecisionBoard.tsx'
      - '.github/workflows/tt-sportsapi-free-results.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: SportsAPI adapter and existing TT settlement guards
        run: node --test tests/tt-sportsapi-free-results.test.mjs tests/tt-odd-even-baseline.test.mjs tests/edge-lab-multi.test.mjs tests/tt-recovery-priority-status.test.mjs tests/tt-prematch-scope-regression.test.mjs
      - name: Dashboard multisport regressions
        run: npm run test:dashboard-multisport
      - name: TypeScript verification
        run: npx tsc --noEmit --pretty false
