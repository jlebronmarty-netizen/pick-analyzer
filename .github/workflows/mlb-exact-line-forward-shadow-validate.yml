name: MLB Exact-Line Forward Shadow Validate

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260928211000_mlb_exact_line_forward_shadow_v1.sql'
      - 'src/services/mlb-exact-line-forward-shadow.service.ts'
      - 'contracts/MLB_EXACT_LINE_FORWARD_SHADOW_V1.json'
      - 'docs/research/MLB_EXACT_LINE_FORWARD_SHADOW_V1.md'
      - 'scripts/research/verify_mlb_exact_line_forward_shadow_v1.test.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/research/verify_mlb_exact_line_forward_shadow_v1.test.mjs
      - run: npm ci
      - run: npm run build
