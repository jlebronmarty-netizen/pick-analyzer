name: PA14 V5 expose stored input

on:
  push:
    branches:
      - pa14-v5-daily-history-ingestion-20260914
    paths:
      - .github/workflows/pa14-v5-expose-stored-input.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pa14-v5-daily-history-ingestion-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expose exact stored input from PA14 materializer
        run: python scripts/pa14-v5-expose-stored-input-patch.py
      - name: Commit branch-only patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/pa14-v2-real-evidence.service.ts
          git diff --cached --check
          git diff --cached --quiet && { echo 'Expected PA14 stored-input patch was not produced'; exit 1; } || true
          git commit -m 'research: expose exact PA14 V2 stored build input'
          git push origin HEAD:pa14-v5-daily-history-ingestion-20260914
