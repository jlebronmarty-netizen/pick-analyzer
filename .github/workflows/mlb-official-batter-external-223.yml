name: MLB Official 223-player batter external validation

on:
  pull_request:
    paths:
      - '.github/workflows/mlb-official-batter-external-223.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch MLB Official game logs and evaluate frozen candidates
        shell: bash
        run: |
          set -euo pipefail
          cat > validate.py <<'PY'
          import json,time,urllib.request,urllib.error
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from collections import defaultdict

          IDS=[457705,502671,514888,518692,521692,543760,543807,545361,553993,571771,571912,572233,592518,592626,592885,593428,593871,595879,596103,596115,596142,600869,605137,605141,605170,606192,607043,607208,608070,608324,608701,608841,621043,621439,621493,621550,621566,624413,624424,624641,640459,640902,641343,641487,641584,641680,642020,642086,642133,643289,643446,644433,645277,647304,650391,650402,650490,656555,656811,657656,660162,660670,660821,661388,663457,663538,663584,663586,663604,663611,663616,663624,663656,663728,663853,664761,664774,665487,665489,665742,665828,665856,666018,666176,666182,666624,666969,668227,668670,668709,668804,668901,668904,668930,668939,668942,668974,669065,669127,669134,669208,669221,669256,669257,669357,669360,669392,669394,669398,669717,669899,670242,670623,671056,671155,671277,671286,671655,671739,672012,672386,672580,672613,672640,672761,673357,673962,676369,676391,676475,676551,677587,677594,677595,677800,677951,678009,678011,678554,679529,679845,680718,680776,680977,681082,681198,681481,681508,681715,682663,682729,682829,682848,682877,682928,682985,683002,683021,683227,683679,683737,683953,686469,686527,686823,686948,687263,687282,687394,687462,687859,687952,690291,691016,691023,691277,691406,691620,691718,691777,693304,693307,693409,694025,694192,694208,694212,694224,694388,694497,694673,694876,695238,695506,695578,695670,695681,695720,695734,696100,696135,699013,699625,700932,701350,701398,701762,702176,702616,800050,800325,804668,805347,805779,805808,805811,806068,807712,807727,807799,811965,815873,828599]
          START='2026-03-26'
          END='2026-07-19'
          BASE='https://statsapi.mlb.com/api/v1/people/{}/stats?stats=gameLog&group=hitting&season=2026'

          def fetch(pid):
              url=BASE.format(pid)
              last=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'pick-analyzer-research/1.0'})
                      with urllib.request.urlopen(req,timeout=20) as r:
                          d=json.load(r)
                      splits=[]
                      for group in d.get('stats') or []:
                          splits.extend(group.get('splits') or [])
                      rows=[]
                      for s in splits:
                          date=str(s.get('date') or '')
                          if not (START <= date <= END):
                              continue
                          st=s.get('stat') or {}
                          game=s.get('game') or {}
                          game_pk=game.get('gamePk')
                          if not game_pk:
                              continue
                          rows.append({
                              'date':date,
                              'gamePk':int(game_pk),
                              'pa':int(st.get('plateAppearances') or 0),
                              'hits':int(st.get('hits') or 0),
                              'runs':int(st.get('runs') or 0),
                              'rbi':int(st.get('rbi') or 0),
                          })
                      rows.sort(key=lambda x:(x['date'],x['gamePk']))
                      return pid,rows,None
                  except Exception as e:
                      last=repr(e)
                      time.sleep(0.4*(attempt+1))
              return pid,[],last

          player_rows={}
          failures={}
          with ThreadPoolExecutor(max_workers=4) as ex:
              futs={ex.submit(fetch,pid):pid for pid in IDS}
              for fut in as_completed(futs):
                  pid,rows,err=fut.result()
                  if err:
                      failures[str(pid)]=err
                  else:
                      player_rows[pid]=rows

          eligible=[]
          for pid in sorted(player_rows):
              rows=player_rows[pid]
              for i,row in enumerate(rows):
                  if i < 10:
                      continue
                  prior=rows[:i]
                  last10=rows[max(0,i-10):i]
                  pa_sum=sum(x['pa'] for x in prior)
                  if pa_sum<=0 or not last10:
                      continue
                  l10_pa=sum(x['pa'] for x in last10)/len(last10)
                  prior_h_pa=sum(x['hits'] for x in prior)/pa_sum
                  prior_r_pa=sum(x['runs'] for x in prior)/pa_sum
                  prior_rbi_pa=sum(x['rbi'] for x in prior)/pa_sum
                  l10_h=sum(x['hits'] for x in last10)/len(last10)
                  l10_r=sum(x['runs'] for x in last10)/len(last10)
                  l10_rbi=sum(x['rbi'] for x in last10)/len(last10)
                  proj_h=0.5*(prior_h_pa*l10_pa)+0.5*l10_h
                  proj_r=0.5*(prior_r_pa*l10_pa)+0.5*l10_r
                  proj_rbi=0.5*(prior_rbi_pa*l10_pa)+0.5*l10_rbi
                  eligible.append({
                      **row,'playerId':pid,
                      'proj_h':proj_h,'proj_r':proj_r,'proj_rbi':proj_rbi,
                      'proj_hrrbi':proj_h+proj_r+proj_rbi
                  })

          def summarize(name,selected,correct_fn,baseline_fn):
              monthly=defaultdict(lambda:[0,0])
              correct=0
              for x in selected:
                  c=1 if correct_fn(x) else 0
                  correct+=c
                  m=x['date'][:7]
                  monthly[m][0]+=1
                  monthly[m][1]+=c
              base_correct=sum(1 for x in eligible if baseline_fn(x))
              out_month=[]
              for m in sorted(monthly):
                  n,c=monthly[m]
                  out_month.append({'month':m,'n':n,'correct':c,'accuracy':c/n if n else None})
              return {
                  'market':name,
                  'n':len(selected),
                  'correct':correct,
                  'accuracy':correct/len(selected) if selected else None,
                  'coverage':len(selected)/len(eligible) if eligible else None,
                  'eligibleBaseline':base_correct/len(eligible) if eligible else None,
                  'monthly':out_month,
                  'worstMonthAccuracy':min((x['accuracy'] for x in out_month),default=None)
              }

          runs_sel=[x for x in eligible if x['proj_r']<=0.14]
          rbi_sel=[x for x in eligible if x['proj_rbi']<=0.10]
          hrrbi_sel=[x for x in eligible if x['proj_hrrbi']<=0.70]

          out={
              'status':'PASS' if not failures else 'PARTIAL',
              'source':'MLB_OFFICIAL_STATSAPI_GAMELOG',
              'season':2026,
              'window':[START,END],
              'requestedPlayers':len(IDS),
              'successfulPlayers':len(player_rows),
              'failedPlayers':len(failures),
              'failureIds':sorted(failures),
              'rawGameLogRows':sum(len(v) for v in player_rows.values()),
              'eligibleRows':len(eligible),
              'frozenFormula':'component=0.50*(prior event/PA * L10 PA/game)+0.50*L10 event/game',
              'retuned':False,
              'results':{
                  'runs':summarize('batter_runs_under_0p5_proj_0p14_v1',runs_sel,lambda x:x['runs']==0,lambda x:x['runs']==0),
                  'rbi':summarize('batter_rbi_under_0p5_proj_0p10_v1',rbi_sel,lambda x:x['rbi']==0,lambda x:x['rbi']==0),
                  'hrrbi':summarize('batter_hrrbi_under_2p5_proj_0p70_v1',hrrbi_sel,lambda x:(x['hits']+x['runs']+x['rbi'])<2.5,lambda x:(x['hits']+x['runs']+x['rbi'])<2.5),
              }
          }
          json.dump(out,open('mlb-official-batter-external-223-summary.json','w'),indent=2)
          print(json.dumps(out,indent=2))
          PY
          python validate.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: mlb-official-batter-external-223-summary
          path: mlb-official-batter-external-223-summary.json
          retention-days: 3
