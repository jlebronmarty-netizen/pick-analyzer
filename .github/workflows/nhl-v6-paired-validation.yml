name: NHL V6 paired validation and quote archive safety

on:
  pull_request:
    paths:
      - 'src/lib/nhl-v6-cohort-finals.mjs'
      - 'src/lib/nhl-v6-prospective-validation.mjs'
      - 'src/services/nhl-late-v6-readiness.service.ts'
      - 'src/services/nhl-late-v6-freeze-writer.service.ts'
      - 'tests/nhl-v6-paired-validation.test.mjs'
      - '.github/workflows/nhl-v6-paired-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: NHL four-way calibration and V6 chronology tests
        run: node --test tests/nhl-v6-paired-validation.test.mjs tests/nhl-v6-late-probable-calibration.test.mjs tests/nhl-free-espn-goalie-probables-v5-20261115.test.mjs tests/nhl-frozen-forward-ledger-20261114.test.mjs
      - name: TypeScript safety
        run: npx tsc --noEmit --pretty false
