name: MLB HRRBI line-surface research

on:
  push:
    branches:
      - research/batter-line-surface-closeouts-v1-20260922
    paths:
      - scripts/research/mlb_hrrbi_line_surface_v1.py
      - .github/workflows/mlb-hrrbi-line-surface-research.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/research/mlb_hrrbi_line_surface_v1.py
      - .github/workflows/mlb-hrrbi-line-surface-research.yml

permissions:
  contents: read

jobs:
  exact-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run exact-source HRRBI development research
        env:
          HRRBI_RESULT_PATH: /tmp/mlb_hrrbi_line_surface_v1_result.json
        run: python3 scripts/research/mlb_hrrbi_line_surface_v1.py
      - name: Upload research result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-hrrbi-line-surface-v1-result
          path: /tmp/mlb_hrrbi_line_surface_v1_result.json
          if-no-files-found: ignore
          retention-days: 7
