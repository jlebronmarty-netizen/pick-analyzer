name: MLB HRRBI line-surface research

on:
  push:
    branches:
      - research/batter-line-surface-closeouts-v1-20260922
    paths:
      - scripts/research/mlb_hrrbi_line_surface_v1.py
      - scripts/research/mlb_hrrbi_2026_frozen_gate_v1.py
      - scripts/research/mlb_hrrbi_2026_lineage_recovery_v1.py
      - scripts/research/verify_mlb_batter_hrrbi_line_surface_v1.test.mjs
      - scripts/research/verify_mlb_batter_line_surface_closeouts_v1.test.mjs
      - artifacts/research/mlb_batter_hrrbi_line_surface_v1.json
      - artifacts/research/mlb_batter_line_surface_closeouts_v1.json
      - artifacts/research/mlb_hrrbi_2026_frozen_gate_name_universe_v1.json
      - docs/research/MLB_BATTER_HRRBI_LINE_SURFACE_V1.md
      - docs/research/MLB_BATTER_LINE_SURFACE_CLOSEOUTS_V1.md
      - .github/workflows/mlb-hrrbi-line-surface-research.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/research/mlb_hrrbi_line_surface_v1.py
      - scripts/research/mlb_hrrbi_2026_frozen_gate_v1.py
      - scripts/research/mlb_hrrbi_2026_lineage_recovery_v1.py
      - scripts/research/verify_mlb_batter_hrrbi_line_surface_v1.test.mjs
      - scripts/research/verify_mlb_batter_line_surface_closeouts_v1.test.mjs
      - artifacts/research/mlb_batter_hrrbi_line_surface_v1.json
      - artifacts/research/mlb_batter_line_surface_closeouts_v1.json
      - artifacts/research/mlb_hrrbi_2026_frozen_gate_name_universe_v1.json
      - docs/research/MLB_BATTER_HRRBI_LINE_SURFACE_V1.md
      - docs/research/MLB_BATTER_LINE_SURFACE_CLOSEOUTS_V1.md
      - .github/workflows/mlb-hrrbi-line-surface-research.yml

permissions:
  contents: read

jobs:
  verify-frozen-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce exact 2025 HRRBI development replay
        env:
          HRRBI_RESULT_PATH: /tmp/mlb_hrrbi_line_surface_v1_result.json
        run: python3 scripts/research/mlb_hrrbi_line_surface_v1.py
      - name: Verify frozen HRRBI artifacts and fail-closed 2026 blocker
        run: node --test scripts/research/verify_mlb_batter_hrrbi_line_surface_v1.test.mjs scripts/research/verify_mlb_batter_line_surface_closeouts_v1.test.mjs
      - name: Upload 2025 replay result
        uses: actions/upload-artifact@v4
        with:
          name: mlb-hrrbi-line-surface-v1-result
          path: /tmp/mlb_hrrbi_line_surface_v1_result.json
          if-no-files-found: error
          retention-days: 7
