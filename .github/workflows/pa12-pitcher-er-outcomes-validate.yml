name: PA12 Pitcher ER Outcomes Validate

on:
  push:
    branches:
      - 'pa12-pitcher-er-outcomes-v1'
    paths:
      - 'src/lib/shared-mlb-pitcher-er-outcome-contract.ts'
      - 'src/services/shared-mlb-pitcher-er-outcomes.service.ts'
      - 'src/app/api/consumer/v1/mlb/pitcher-earned-runs/route.ts'
      - 'scripts/pa12-pitcher-er-outcome-contract-check.mjs'
      - 'docs/CERTIFICATION/PA12_PITCHER_ER_OUTCOME_CONTRACT.md'
      - '.github/workflows/pa12-pitcher-er-outcomes-validate.yml'
  pull_request:
    paths:
      - 'src/lib/shared-mlb-pitcher-er-outcome-contract.ts'
      - 'src/services/shared-mlb-pitcher-er-outcomes.service.ts'
      - 'src/app/api/consumer/v1/mlb/pitcher-earned-runs/route.ts'
      - 'scripts/pa12-pitcher-er-outcome-contract-check.mjs'
      - 'docs/CERTIFICATION/PA12_PITCHER_ER_OUTCOME_CONTRACT.md'
      - '.github/workflows/pa12-pitcher-er-outcomes-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: PA12 exact ER outcome contract checks
        run: node --loader ./scripts/local-ts-loader.mjs scripts/pa12-pitcher-er-outcome-contract-check.mjs
      - name: Production TypeScript build
        run: npm run build
