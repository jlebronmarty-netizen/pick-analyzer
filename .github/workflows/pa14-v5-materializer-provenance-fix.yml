name: PA14 V5 materializer provenance fix

on:
  push:
    branches:
      - pa14-v5-daily-history-ingestion-20260914
    paths:
      - .github/workflows/pa14-v5-materializer-provenance-fix.yml
      - src/services/pa14-v2-real-evidence.service.ts

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply PA14 materializer provenance fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pa14-v5-daily-history-ingestion-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact provenance fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/pa14-v2-real-evidence.service.ts')
          s = p.read_text()

          old = "      .in('game_pk', startGamePks)\n      .range(from, from + PAGE_SIZE - 1)"
          new = "      .in('game_pk', startGamePks)\n      .order('game_pk', { ascending: true })\n      .order('at_bat_number', { ascending: true })\n      .order('pitch_number', { ascending: true })\n      .range(from, from + PAGE_SIZE - 1)"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)

          old = "      .or(`canonical_home_team_id.eq.${TARGET_OPPONENT_CANONICAL},canonical_away_team_id.eq.${TARGET_OPPONENT_CANONICAL}`)\n      .range(from, from + PAGE_SIZE - 1)"
          new = "      .or(`canonical_home_team_id.eq.${TARGET_OPPONENT_CANONICAL},canonical_away_team_id.eq.${TARGET_OPPONENT_CANONICAL}`)\n      .order('game_pk', { ascending: true })\n      .order('at_bat_number', { ascending: true })\n      .order('pitch_number', { ascending: true })\n      .range(from, from + PAGE_SIZE - 1)"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)

          assert s.count('canonicalDigest(play)') == 2, s.count('canonicalDigest(play)')
          s = s.replace('canonicalDigest(play)', 'sha256Text(JSON.stringify(play))')

          old = "        authoritativeAt: providerTimestamp,\n        availableBy: observedAt,\n        evidenceDigest: censusDigest,"
          new = "        authoritativeAt: new Date(maxCompletion).toISOString(),\n        availableBy: new Date(maxCompletion).toISOString(),\n        evidenceDigest: censusDigest,"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)

          p.write_text(s)
          PY
      - name: Commit branch-only fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/pa14-v2-real-evidence.service.ts
          git diff --cached --check
          git commit -m "chore: apply PA14 materializer provenance fixes"
          git push origin HEAD:pa14-v5-daily-history-ingestion-20260914
