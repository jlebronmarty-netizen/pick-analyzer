name: MLB Odds API Credential Contract Audit

on:
  push:
    branches:
      - feature/mlb-decision-board-v1
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'docs/**'
      - '.env.example'
      - '.github/workflows/mlb-credential-contract-audit.yml'

permissions:
  contents: read

jobs:
  credential-contract-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Inventory Odds API credential references safely
        shell: bash
        run: |
          set -euo pipefail
          echo 'Files referencing ODDS_API_KEY or THE_ODDS_API_KEY (filenames only):'
          git grep -l -E '(^|[^A-Z_])(ODDS_API_KEY|THE_ODDS_API_KEY)([^A-Z_]|$)' -- . \
            ':(exclude)package-lock.json' \
            ':(exclude)node_modules/**' \
            | sort || true

      - name: Enforce canonical runtime credential
        shell: bash
        run: |
          set -euo pipefail
          legacy_files="$(git grep -l -E 'process\.env\.ODDS_API_KEY' -- 'src/**/*.ts' 'src/**/*.tsx' || true)"
          if [ -n "$legacy_files" ]; then
            echo 'Legacy process.env.ODDS_API_KEY runtime references found in:'
            printf '%s\n' "$legacy_files"
            exit 1
          fi
          echo 'PASS: active TypeScript runtime uses no process.env.ODDS_API_KEY references.'
