name: MLB Odds API Credential Contract Audit

on:
  push:
    branches:
      - feature/mlb-decision-board-v1
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'docs/**'
      - '.env.example'
      - '.github/workflows/mlb-credential-contract-audit.yml'

permissions:
  contents: read

jobs:
  credential-contract-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Inventory Odds API credential references safely
        shell: bash
        run: |
          set -euo pipefail
          echo 'Files referencing ODDS_API_KEY or THE_ODDS_API_KEY (filenames only):'
          git grep -l -E '(^|[^A-Z_])(ODDS_API_KEY|THE_ODDS_API_KEY)([^A-Z_]|$)' -- . \
            ':(exclude)package-lock.json' \
            ':(exclude)node_modules/**' \
            | sort || true

      - name: Inventory legacy runtime references without exposing values
        shell: bash
        run: |
          set -euo pipefail
          echo 'Legacy process.env.ODDS_API_KEY runtime references (filenames only; historical/global debt inventory):'
          git grep -l -E 'process\.env\.ODDS_API_KEY' -- 'src/**/*.ts' 'src/**/*.tsx' | sort || true

      - name: Enforce canonical credential on MLB Decision Board certification path
        shell: bash
        run: |
          set -euo pipefail
          certification_paths=(
            'src/services/mlb-decision-board-player-prop-sync.service.ts'
            'src/services/the-odds-api-current-odds-acquisition.service.ts'
            'src/services/the-odds-api-event-crosswalk.service.ts'
            'src/app/api/mlb/player-props/preflight/route.ts'
            'src/app/api/mlb/player-props/sync/route.ts'
          )
          legacy_files="$(git grep -l -E 'process\.env\.ODDS_API_KEY' -- "${certification_paths[@]}" || true)"
          if [ -n "$legacy_files" ]; then
            echo 'Legacy process.env.ODDS_API_KEY references found on the MLB Decision Board certification path:'
            printf '%s\n' "$legacy_files"
            exit 1
          fi
          echo 'PASS: MLB Decision Board certification path does not use process.env.ODDS_API_KEY.'

      - name: Audit Vercel Odds API env scopes when an existing token is available
        if: github.event_name == 'push'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'VERCEL_ENV_SCOPE_AUDIT_SKIPPED_NO_TOKEN'
            exit 0
          fi

          response_file="$(mktemp)"
          http_code="$(curl -sS \
            --connect-timeout 10 \
            --max-time 30 \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -o "$response_file" \
            -w '%{http_code}' \
            'https://api.vercel.com/v10/projects/prj_hmkAkzUTe3b7M7yedvshGl5L9rP7/env?teamId=team_5NEeiCoWmTBO4kAkgKZwoQmN')"

          if [ "$http_code" != '200' ]; then
            echo "VERCEL_ENV_SCOPE_AUDIT_HTTP_${http_code}"
            exit 0
          fi

          RESPONSE_FILE="$response_file" node <<'NODE'
          const fs = require('fs')
          const payload = JSON.parse(fs.readFileSync(process.env.RESPONSE_FILE, 'utf8'))
          const envs = Array.isArray(payload.envs) ? payload.envs : Array.isArray(payload.data) ? payload.data : []
          const wanted = new Set(['ODDS_API_KEY', 'THE_ODDS_API_KEY'])
          const rows = envs
            .filter((row) => wanted.has(String(row?.key ?? '')))
            .map((row) => ({
              key: row.key,
              target: row.target ?? null,
              gitBranch: row.gitBranch ?? null,
              type: row.type ?? null,
              customEnvironmentIds: row.customEnvironmentIds ?? null,
            }))
          console.log(JSON.stringify({ vercelOddsApiEnvMetadata: rows }, null, 2))
          NODE
