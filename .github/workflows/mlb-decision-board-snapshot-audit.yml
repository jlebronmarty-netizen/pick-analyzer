name: MLB Decision Board Canary Snapshot Audit

on:
  push:
    branches:
      - feature/mlb-decision-board-v1
    paths:
      - 'docs/CERTIFICATION/mlb-decision-board-snapshot-audit-request.json'

permissions:
  contents: read
  statuses: read
  id-token: write

jobs:
  audit-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      MLB_PREVIEW_URL: https://pick-analyzer-git-feature-mlb-decision-board-v1-pick-analyzer.vercel.app
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          EVENT_ID="$(node -e "const r=require('./docs/CERTIFICATION/mlb-decision-board-snapshot-audit-request.json');if(r.authorized!==true||r.paidCallsAllowed!==false||r.mutationsAllowed!==false||!String(r.eventId||'').startsWith('baseball_mlb:mlb:'))process.exit(1);process.stdout.write(r.eventId)")"
          echo "event_id=${EVENT_ID}" >> "$GITHUB_OUTPUT"
      - name: Mint GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken()
            core.setSecret(token)
            core.setOutput('token', token)
      - name: Wait for matching Vercel deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            status_json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status")"
            state="$(printf '%s' "$status_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const v=(j.statuses||[]).find(x=>x.context==='Vercel');process.stdout.write(v?.state||'pending')})")"
            if [ "$state" = 'success' ]; then exit 0; fi
            if [ "$state" = 'failure' ] || [ "$state" = 'error' ]; then exit 1; fi
            if [ "$attempt" = '48' ]; then exit 1; fi
            sleep 5
          done
      - name: Read canary snapshots
        shell: bash
        env:
          OIDC: ${{ steps.oidc.outputs.token }}
          EVENT_ID: ${{ steps.request.outputs.event_id }}
        run: |
          set -euo pipefail
          f="$(mktemp)"
          encoded="$(node -p "encodeURIComponent(process.env.EVENT_ID)")"
          code="$(curl -sS --connect-timeout 10 --max-time 45 -H "x-vercel-trusted-oidc-idp-token: ${OIDC}" -o "$f" -w '%{http_code}' "${MLB_PREVIEW_URL}/api/mlb/player-props/certification-snapshots?eventId=${encoded}")"
          echo "CERTIFICATION_SNAPSHOTS_HTTP_${code}"
          test "$code" = '200'
          RESPONSE_FILE="$f" node - <<'NODE'
          const fs=require('fs')
          const p=JSON.parse(fs.readFileSync(process.env.RESPONSE_FILE,'utf8'))
          const rows=Array.isArray(p.rows)?p.rows:[]
          const out={readOnly:p.readOnly,eventId:p.eventId,summary:p.summary,rows}
          console.log(JSON.stringify(out,null,2))
          if(p.readOnly!==true||rows.length!==14) process.exit(1)
          if(rows.some(r=>r.officialPickEligible!==false)) process.exit(1)
          NODE
