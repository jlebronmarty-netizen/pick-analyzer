name: MLB BDL 2026 Run Line Total Backfill

on:
  push:
    branches:
      - main
    paths:
      - 'src/services/mlb-bdl-opening-runline-total-2026-backfill.service.ts'
      - 'src/app/api/research/mlb/bdl-opening-runline-total-2026-backfill/route.ts'
      - '.github/workflows/mlb-bdl-2026-runline-total-backfill.yml'

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      ENDPOINT: https://pick-analyzer.vercel.app/api/research/mlb/bdl-opening-runline-total-2026-backfill

    steps:
      - name: Require execution credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CRON_SECRET:-}"

      - name: Wait for authenticated production route
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for _ in $(seq 1 90); do
            code="$(curl -sS --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' "${ENDPOINT}" || true)"
            if [ "$code" = "401" ]; then
              ready=true
              break
            fi
            sleep 5
          done
          test "$ready" = "true"

      - name: Run resumable backfill to completion
        shell: bash
        run: |
          set -euo pipefail
          rm -f backfill-final.json backfill-progress.ndjson
          done_flag=false

          for batch in $(seq 1 30); do
            response="backfill-${batch}.json"

            curl -fsS               --connect-timeout 10               --max-time 300               -H "Authorization: Bearer ${CRON_SECRET}"               "${ENDPOINT}"               -o "${response}"

            node -e '
              const fs=require("fs");
              const file=process.argv[1];
              const batch=Number(process.argv[2]);
              const p=JSON.parse(fs.readFileSync(file,"utf8"));
              if(p.success!==true) throw new Error("backfill batch failed: "+JSON.stringify({status:p.status,error:p.error}));
              console.log(JSON.stringify({
                batch,
                status:p.status,
                done:p.done,
                totalDates:p.totalDates,
                completedDates:p.completedDates,
                remainingDates:p.remainingDates,
                processedDates:p.processedDates,
                insertedRows:p.insertedRows??0,
                providerCallsMade:p.providerCallsMade??0,
                failedDates:p.failedDates??[]
              }));
            ' "${response}" "${batch}" | tee -a backfill-progress.ndjson

            cp "${response}" backfill-final.json

            done_flag="$(node -e '
              const fs=require("fs");
              const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              process.stdout.write(String(p.done===true));
            ' "${response}")"

            if [ "${done_flag}" = "true" ]; then
              break
            fi
          done

          test "${done_flag}" = "true"

      - name: Verify final contract
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs=require("fs");
            const p=JSON.parse(fs.readFileSync("backfill-final.json","utf8"));
            if(p.success!==true || p.done!==true) throw new Error("backfill did not finish");
            if(p.historicalOddsApiCalls!==0) throw new Error("historical Odds API usage detected");
            if(p.officialPicksModified!==false) throw new Error("Official Picks boundary failed");
            if(p.apostarActivated!==false) throw new Error("APOSTAR boundary failed");
            if(p.provider!=="balldontlie") throw new Error("unexpected provider");
            console.log(JSON.stringify({
              status:p.status,
              totalDates:p.totalDates,
              completedDates:p.completedDates,
              remainingDates:p.remainingDates,
              storedRows:p.storedRows??null,
              historicalOddsApiCalls:p.historicalOddsApiCalls
            },null,2));
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-bdl-2026-runline-total-backfill
          path: |
            backfill-progress.ndjson
            backfill-final.json
          retention-days: 14
