name: MLB Totals V6 Nonlinear Research

on:
  push:
    branches:
      - research/totals-2025-historical-backfill
    paths:
      - '.github/workflows/mlb-totals-v6-nonlinear-research.yml'
      - 'src/app/api/research/mlb/totals-v6-dataset/route.ts'
      - 'scripts/research/train_mlb_totals_v6_nonlinear.py'
      - 'docs/research/totals-v6-nonlinear-request.json'
  workflow_dispatch:

permissions:
  contents: write
  statuses: read
  id-token: write

concurrency:
  group: mlb-totals-v6-nonlinear-research
  cancel-in-progress: false

env:
  TOTALS_V6_PREVIEW_URL: https://pick-analyzer-git-research-totals-2025-his-e0b747-pick-analyzer.vercel.app
  REQUEST_PATH: docs/research/totals-v6-nonlinear-request.json
  DATASET_PATH: /tmp/mlb_totals_v6_dataset.json
  OUTPUT_PATH: artifacts/research/mlb_totals_v6_nonlinear_result.json

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/totals-2025-historical-backfill
          fetch-depth: 0

      - name: Validate research-only request
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const request = JSON.parse(fs.readFileSync(process.env.REQUEST_PATH, 'utf8'))
          const checks = [
            [request.contract === 'MLB_TOTALS_V6_NONLINEAR_REQUEST/1.0.0', 'contract mismatch'],
            [request.authorized === true, 'authorized must be true'],
            [request.branch === 'research/totals-2025-historical-backfill', 'branch mismatch'],
            [request.researchOnly === true, 'researchOnly must be true'],
            [request.market === 'total', 'market must be total'],
            [request.season === 2025, 'season must be 2025'],
            [request.holdoutMayOpenOnlyAfterValidationGate === true, 'holdout gate required'],
            [request.use2026ForSelection === false, '2026 selection must remain false'],
            [request.expectedOddsApiCredits === 0, 'Odds API credits must be zero'],
            [request.providerCallsAllowed === false, 'provider calls must be false'],
            [request.officialPicksWritesAllowed === false, 'Official Picks writes prohibited'],
            [request.apostarActivationAllowed === false, 'APOSTAR prohibited'],
            [request.productionPromotionAllowed === false, 'production promotion prohibited'],
            [request.rawDatasetMayBeCommitted === false, 'raw dataset commit prohibited'],
          ]
          const failures = checks.filter(([ok]) => !ok).map(([, message]) => message)
          if (failures.length) throw new Error(`TOTALS_V6_REQUEST_INVALID: ${failures.join('; ')}`)
          console.log('PASS: Totals V6 bounded research request validated.')
          NODE

      - name: Mint GitHub OIDC token for protected preview
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken()
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Wait for matching Vercel deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            status_json="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status")"
            vercel_state="$(printf '%s' "$status_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const v=(j.statuses||[]).find(x=>x.context==='Vercel');process.stdout.write(v?.state||'pending')})")"
            if [ "$vercel_state" = 'success' ]; then
              echo 'PASS: matching Vercel preview deployment is READY.'
              exit 0
            fi
            if [ "$vercel_state" = 'failure' ] || [ "$vercel_state" = 'error' ]; then
              echo 'VERCEL_PREVIEW_DEPLOYMENT_FAILED'
              exit 1
            fi
            if [ "$attempt" = '48' ]; then
              echo 'VERCEL_PREVIEW_DEPLOYMENT_NOT_READY'
              exit 1
            fi
            sleep 5
          done

      - name: Fetch protected 2025 research dataset
        shell: bash
        env:
          VERCEL_GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          http_code="$(curl -sS \
            --connect-timeout 10 \
            --max-time 120 \
            -H "x-vercel-trusted-oidc-idp-token: ${VERCEL_GITHUB_OIDC_TOKEN}" \
            -o "$DATASET_PATH" \
            -w '%{http_code}' \
            "${TOTALS_V6_PREVIEW_URL}/api/research/mlb/totals-v6-dataset")"
          if [ "$http_code" != '200' ]; then
            echo "TOTALS_V6_DATASET_HTTP_${http_code}"
            cat "$DATASET_PATH" || true
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs')
          const payload = JSON.parse(fs.readFileSync(process.env.DATASET_PATH, 'utf8'))
          const checks = [
            [payload.contract === 'MLB_TOTALS_V6_NONLINEAR_DATASET/1.0.0', 'dataset contract mismatch'],
            [payload.researchOnly === true, 'dataset must be research-only'],
            [payload.branch === 'research/totals-2025-historical-backfill', 'dataset branch mismatch'],
            [payload.target === 'close_over_label', 'target mismatch'],
            [payload.officialPicksWrites === 0, 'Official Picks write boundary violated'],
            [payload.apostarActivation === false, 'APOSTAR boundary violated'],
            [Number(payload.nonPushRowCount) > 1500, 'insufficient non-push rows'],
            [Array.isArray(payload.rows), 'rows missing'],
          ]
          const forbidden = new Set(['total_runs', 'open_total_margin', 'close_total_margin', 'actual_winner'])
          for (const row of payload.rows || []) {
            for (const key of forbidden) {
              if (Object.prototype.hasOwnProperty.call(row, key)) throw new Error(`FORBIDDEN_FIELD_PRESENT:${key}`)
            }
          }
          const failures = checks.filter(([ok]) => !ok).map(([, message]) => message)
          if (failures.length) throw new Error(`TOTALS_V6_DATASET_INVALID: ${failures.join('; ')}`)
          console.log(JSON.stringify({rowCount: payload.rowCount, nonPushRowCount: payload.nonPushRowCount}, null, 2))
          NODE

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded research dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'numpy>=2.0,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2'

      - name: Train nonlinear Totals V6 research candidates
        run: |
          python scripts/research/train_mlb_totals_v6_nonlinear.py \
            --input "$DATASET_PATH" \
            --output "$OUTPUT_PATH"

      - name: Validate V6 result boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const result = JSON.parse(fs.readFileSync(process.env.OUTPUT_PATH, 'utf8'))
          const checks = [
            [result.contract === 'MLB_TOTALS_V6_NONLINEAR_RESEARCH/1.0.0', 'result contract mismatch'],
            [result.research_only === true, 'result must be research-only'],
            [result.official_picks_writes === 0, 'Official Picks write boundary violated'],
            [result.apostar_activation === false, 'APOSTAR boundary violated'],
            [result.odds_api_credits_consumed === 0, 'Odds API credits must remain zero'],
            [result['2026_used_for_selection'] === false, '2026 selection contamination'],
          ]
          const failures = checks.filter(([ok]) => !ok).map(([, message]) => message)
          if (failures.length) throw new Error(`TOTALS_V6_RESULT_INVALID: ${failures.join('; ')}`)
          console.log(JSON.stringify({status: result.status, modelsTried: result.models_tried, gateCandidateCount: result.gate_candidate_count, selected: result.selected_candidate_before_holdout, holdout: result.holdout_metrics}, null, 2))
          NODE

      - name: Commit research result only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTPUT_PATH"
          if git diff --cached --quiet; then
            echo 'No V6 result changes to commit.'
            exit 0
          fi
          git commit -m 'research(totals): record V6 nonlinear result'
          git push origin HEAD:research/totals-2025-historical-backfill
