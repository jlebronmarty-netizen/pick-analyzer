name: NBA Props UI visibility safety
on:
  pull_request:
    paths:
      - 'src/app/nba-market-data/board.jsx'
      - 'tests/nba-props-visibility-audit.test.mjs'
      - '.github/workflows/nba-props-visibility-safety.yml'
permissions:
  contents: read
jobs:
  ui-research-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: NBA props UI visibility tests
        run: node --test tests/nba-props-visibility-audit.test.mjs
      - name: Confirm production cron and model unmodified
        run: git diff --exit-code origin/main...HEAD -- vercel.json src/services/nba-prediction-engine.service.ts src/services/nba-goat-runtime.service.ts
