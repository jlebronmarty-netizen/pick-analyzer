name: NBA Props UI visibility safety
on:
  pull_request:
    paths:
      - 'src/app/nba-market-data/board.jsx'
      - 'tests/nba-props-visibility-audit.test.mjs'
      - 'tests/nba-props-shadow-panel.test.mjs'
      - 'src/app/nba-market-data/props-shadow-panel.jsx'
      - 'src/app/api/market-data/nba/props-shadow/route.ts'
      - 'src/lib/nba/nba-props-panel-core.mjs'
      - '.github/workflows/nba-props-visibility-safety.yml'
permissions:
  contents: read
jobs:
  ui-research-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: NBA props UI visibility tests
        run: node --test tests/nba-props-visibility-audit.test.mjs
      - name: NBA props SHADOW panel anti-leakage unit tests
        run: node --test tests/nba-props-shadow-panel.test.mjs
      - name: Install dependencies and validate TypeScript
        run: npm ci --no-audit --no-fund && npx tsc --noEmit --pretty false
      - name: Confirm production cron and model unmodified
        run: git diff --exit-code origin/main...HEAD -- vercel.json src/services/nba-prediction-engine.service.ts src/services/nba-goat-runtime.service.ts
