name: Update Canonical MLB Run Line Handoff

on:
  push:
    branches:
      - research/runline-2025-historical-backfill
    paths:
      - 'docs/research/runline-handoff-update-request.json'

permissions:
  contents: write

jobs:
  update-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate request
        run: |
          node <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('docs/research/runline-handoff-update-request.json','utf8'))
          if(!(r.authorized===true&&r.coveredGames===2430&&r.targetGames===2430&&r.oddsApiCreditsConsumed===0&&r.officialPicksModified===false&&r.apostarActivated===false)) throw new Error('INVALID_HANDOFF_UPDATE_REQUEST')
          NODE
      - name: Update canonical handoff on latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 <<'PY'
          from pathlib import Path
          p=Path('docs/research/MLB_MODEL_RESEARCH_HANDOFF.md')
          text=p.read_text()
          start='<!-- RUNLINE_2025_BACKFILL_STATE_START -->'
