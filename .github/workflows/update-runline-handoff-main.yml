name: Update Canonical MLB Run Line Handoff

on:
  push:
    branches:
      - research/runline-2025-historical-backfill
    paths:
      - 'docs/research/runline-handoff-update-request.json'

permissions:
  contents: write

jobs:
  update-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate request
        run: |
          node <<'NODE'
          const fs = require('fs')
          const r = JSON.parse(fs.readFileSync('docs/research/runline-handoff-update-request.json', 'utf8'))
          if (!(r.authorized === true &&
                r.coveredGames === 2430 &&
                r.targetGames === 2430 &&
                r.oddsApiCreditsConsumed === 0 &&
                r.officialPicksModified === false &&
                r.apostarActivated === false &&
                r.external2026GateClosed === true &&
                r.v1Retuned === false)) {
            throw new Error('INVALID_HANDOFF_UPDATE_REQUEST')
          }
          NODE

      - name: Update canonical handoff on latest main
        run: |
          set -euo pipefail
          STATE_FILE='docs/research/RUNLINE_CANONICAL_STATE_2026-09-16.md'
          test -f "$STATE_FILE"
          cp "$STATE_FILE" /tmp/runline-canonical-state.md
          git fetch origin main
          git checkout -B main origin/main
          python3 <<'PY'
          from pathlib import Path

          p = Path('docs/research/MLB_MODEL_RESEARCH_HANDOFF.md')
          state_path = Path('/tmp/runline-canonical-state.md')
          text = p.read_text()
          block = state_path.read_text().strip()
          start = '<!-- RUNLINE_RESEARCH_STATE_START -->'
          end = '<!-- RUNLINE_RESEARCH_STATE_END -->'

          if start not in block or end not in block:
              raise SystemExit('STATE_BLOCK_MARKERS_MISSING')

          if start in text and end in text:
              a = text.index(start)
              b = text.index(end) + len(end)
              text = text[:a] + block + text[b:]
          else:
              text = text.rstrip() + '\n\n' + block + '\n'

          p.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/MLB_MODEL_RESEARCH_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'Canonical handoff already up to date.'
            exit 0
          fi
          git commit -m 'docs: close Run Line 2026 external gate'
          git push origin HEAD:main
