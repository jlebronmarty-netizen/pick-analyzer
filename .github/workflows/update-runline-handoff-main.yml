### Pregame / leakage policy for market rows

- Final score, winner, final runs, RBI, game result, and other postgame outcomes were **not copied** from the odds sources.
- `opening` rows are pregame/training eligible.
- Source `closing/currentLine` rows from the SBR datasets are retained for market diagnostics but are **not automatically eligible for the pure 2025 pregame training path**, because the public source does not expose exact historical snapshot timestamps for those rows.
- Timestamped FanDuel public snapshots in the final-six fallback were accepted only when the source itself showed an update time before first pitch.
- Public pregame articles without an exact quote timestamp retain explicit warnings; no timestamp was fabricated.
- Keep the final-six fallback source separately identifiable in model diagnostics so sensitivity tests can exclude it if desired. It is only 6/2,430 games (~0.25%).

### Explicit identity exceptions — do not replace with fuzzy matching

The following real schedule/resumption cases required explicit mappings:

- TOR @ NYY originally scheduled 2025-04-26 → canonical makeup on 2025-04-27 Game 2: `game_pk 778170`.
- ATL @ CIN Bristol Speedway Classic began 2025-08-02 and resumed 2025-08-03: canonical `game_pk 776907` remains on 2025-08-02.
- CLE @ MIN originally scheduled 2025-05-20 → makeup on 2025-09-20 Game 1: `game_pk 777839`.

Do **not** introduce a general ±1-day fuzzy date rule. Preserve explicit identity mappings only.

