name: PA14 V2 Probe Type Fix

on:
  push:
    branches:
      - 'research/pa14-v2-collection-probe-824466'
    paths:
      - '.github/workflows/pa14-v2-probe-typefix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pa14-v2-collection-probe-824466
          fetch-depth: 0
      - name: Add explicit ELIGIBLE narrowing guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/api/research/pa14/v2-collection-probe-824466/route.ts')
          text = p.read_text()
          marker = "    if (!first || first.status !== 'ELIGIBLE') throw new Error('PA14_COLLECTION_REPLAY_STATUS_NARROWING_FAILED')\n"
          if marker not in text:
              needle = "    if (!pass) {\n      throw new Error(`PA14_COLLECTION_REPLAY_FAILED:${JSON.stringify({ networkCalls, deterministicReplay, expectedMatch, lineageMatch, temporalLeakageZero, status: first?.status })}`)\n    }\n\n"
              if needle not in text:
                  raise SystemExit('PA14_TYPEFIX_INSERTION_POINT_MISSING')
              text = text.replace(needle, needle + marker + '\n', 1)
              p.write_text(text)
          PY
          git diff --check
          git diff -- src/app/api/research/pa14/v2-collection-probe-824466/route.ts
      - name: Commit type-only probe repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/api/research/pa14/v2-collection-probe-824466/route.ts
          git commit -m 'fix(pa14): narrow stored replay result before response'
          git push origin HEAD:research/pa14-v2-collection-probe-824466
