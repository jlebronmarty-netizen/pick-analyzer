name: NHL Regulation OT SO V8 research safety
on:
  pull_request:
    paths:
      - 'src/lib/nhl-regulation-shootout-v8-research.mjs'
      - 'tests/nhl-regulation-shootout-v8-research.test.mjs'
      - '.github/workflows/nhl-regulation-shootout-v8.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: NHL regulation, OT, shootout pure research tests
        run: node --test tests/nhl-regulation-shootout-v8-research.test.mjs tests/nhl-v6-late-probable-calibration.test.mjs tests/nhl-exact-circa-market-research.test.mjs
      - name: TypeScript verification
        run: npx tsc --noEmit --pretty false
