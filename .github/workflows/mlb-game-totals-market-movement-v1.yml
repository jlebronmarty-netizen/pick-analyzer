name: MLB Game Totals Market Movement V1

on:
  pull_request:
    paths:
      - 'scripts/research/mlb-game-totals-market-movement-v1.mjs'
      - '.github/workflows/mlb-game-totals-market-movement-v1.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download public SBR-derived release ephemerally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/totals-market-movement-v1
          curl -fL --retry 3 --connect-timeout 10 --max-time 180             'https://github.com/ArnavSaraogi/mlb-odds-scraper/releases/download/dataset/mlb_odds_dataset.json'             -o tmp/totals-market-movement-v1/mlb_odds_dataset.json
          echo '3f952fd0bfae9f4f2d17e66692cb936ce6e1a5f6b415318012090c85933b882b  tmp/totals-market-movement-v1/mlb_odds_dataset.json' | sha256sum -c -

      - name: Run predeclared 2021-2024 development and one-shot 2025 holdout
        shell: bash
        run: |
          set -euo pipefail
          node scripts/research/mlb-game-totals-market-movement-v1.mjs             --input=tmp/totals-market-movement-v1/mlb_odds_dataset.json             --output=tmp/totals-market-movement-v1/result.json

      - name: Remove raw third-party dataset
        if: always()
        shell: bash
        run: rm -f tmp/totals-market-movement-v1/mlb_odds_dataset.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-game-totals-market-movement-v1
          path: tmp/totals-market-movement-v1/result.json
          retention-days: 7
