name: MLB approved prop recovery idempotency

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/mlb-approved-prop-recovery-idempotency-validate.mjs

  recover_postseason_board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Invoke one-shot MLB postseason recovery
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CRON_SECRET:-}"
          curl -fsS --connect-timeout 10 --max-time 480 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://pick-analyzer.vercel.app/api/cron/mlb-statcast-daily" \
            -o recovery.json
          cat recovery.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-postseason-board-recovery-inline
          path: recovery.json
          retention-days: 2
