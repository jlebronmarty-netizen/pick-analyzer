name: MLB Totals V37 External 2026

on:
  push:
    branches: [research/totals-2025-historical-backfill]
    paths:
      - '.github/workflows/mlb-totals-v37-external-2026.yml'
      - 'docs/research/totals-v37-external-2026-request.json'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: mlb-totals-v37-external-2026
  cancel-in-progress: false

env:
  REQUEST_PATH: docs/research/totals-v37-external-2026-request.json
  FREEZE_PATH: artifacts/research/mlb_totals_v37_frozen_candidate.json
  OUTPUT_PATH: artifacts/research/mlb_totals_v37_external_2026_result.json

jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/totals-2025-historical-backfill
          fetch-depth: 0

      - name: Validate immutable external request and freeze
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs')
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST_PATH,'utf8'))
          const f=JSON.parse(fs.readFileSync(process.env.FREEZE_PATH,'utf8'))
          const c=[
            [r.contract==='MLB_TOTALS_V37_EXTERNAL_2026_REQUEST/1.0.0','request contract'],
            [r.authorized===true,'authorized'],[r.researchOnly===true,'research'],
            [r.freezeContract===f.contract,'freeze contract'],
            [r.freezeGithubSha===f.github_sha_at_freeze,'freeze sha'],
            [r.featureHashSha256===f.feature_hash_sha256,'feature hash'],
            [r.frozenCandidate.architecture===f.candidate.architecture,'architecture'],
            [r.frozenCandidate.specIndex===f.candidate.spec_index,'spec'],
            [r.frozenCandidate.mode===f.candidate.mode,'mode'],
            [r.frozenCandidate.threshold===f.candidate.threshold,'threshold'],
            [r.frozenCandidate.params.depth===f.candidate.params.depth,'param depth'],
            [r.frozenCandidate.params.iterations===f.candidate.params.iterations,'param iterations'],
            [r.frozenCandidate.params.learning_rate===f.candidate.params.learning_rate,'param learning_rate'],
            [r.frozenCandidate.params.l2_leaf_reg===f.candidate.params.l2_leaf_reg,'param l2_leaf_reg'],
            [r.frozenCandidate.params.random_strength===f.candidate.params.random_strength,'param random_strength'],
            [r.trainingSeason===2025,'training'],[r.externalSeason===2026,'external'],
            [r.retuningAllowed===false,'retuning'],[r.thresholdChangesAllowed===false,'threshold changes'],
            [r.featureChangesAllowed===false,'feature changes'],[r.expectedOddsApiCredits===0,'credits'],
            [r.providerCallsAllowed===false,'providers'],[r.officialPicksWritesAllowed===false,'official'],
            [r.apostarActivationAllowed===false,'apostar'],[r.productionPromotionAllowed===false,'production']
          ]
          const bad=c.filter(([x])=>!x).map(([,n])=>n)
          if(bad.length)throw new Error('V37_EXTERNAL_REQUEST_INVALID:'+bad.join(','))
          console.log('PASS frozen V37 external request')
          NODE

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'catboost==1.2.10' 'numpy>=2.0,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'requests>=2.32,<3'

      - name: Mint GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token=await core.getIDToken('supabase-v37-external')
            core.setSecret(token)
            core.setOutput('token',token)

      - name: Run one-shot frozen 2026 external evaluation
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: python scripts/research/evaluate_mlb_totals_v37_external_2026.py

      - name: Validate no-retune external result
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs')
          const r=JSON.parse(fs.readFileSync(process.env.OUTPUT_PATH,'utf8'))
          const q=JSON.parse(fs.readFileSync(process.env.REQUEST_PATH,'utf8'))
          const c=[
            [r.contract==='MLB_TOTALS_V37_EXTERNAL_2026_RESULT/1.0.0','contract'],
            [r.candidate_freeze_sha===q.freezeGithubSha,'freeze sha'],
            [r.feature_hash_sha256===q.featureHashSha256,'feature hash'],
            [r.external_rows===1576,'row count'],
            [r.selected_using_2025_only===true,'2025 selection'],
            [r.external_2026_opened_once===true,'one shot'],
            [r.retuning_after_external===false,'retuning'],
            [r.official_picks_writes===0,'official'],[r.apostar_activation===false,'apostar'],
            [r.production_promotion===false,'production'],[r.odds_api_historical_credits_consumed===0,'credits']
          ]
          const bad=c.filter(([x])=>!x).map(([,n])=>n)
          if(bad.length)throw new Error('V37_EXTERNAL_RESULT_INVALID:'+bad.join(','))
          console.log(JSON.stringify({
            status:r.status,selectedN:r.selected_n,correct:r.selected_correct,
            accuracy:r.selected_accuracy,coverage:r.selected_coverage_vs_nonpush,
            worstMonth:r.worst_month_accuracy
          },null,2))
          NODE

      - name: Commit external result only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTPUT_PATH"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(totals): record V37 one-shot 2026 external'
          git pull --rebase origin research/totals-2025-historical-backfill
          git push origin HEAD:research/totals-2025-historical-backfill

      - uses: actions/upload-artifact@v4
        with:
          name: mlb-totals-v37-external-2026
          path: artifacts/research/mlb_totals_v37_external_2026_result.json
          retention-days: 14
          if-no-files-found: error
