name: MLB pitcher feature query optimization

on:
  push:
    branches:
      - research/pitcher-feature-query-optimization-20260924
    paths:
      - src/services/mlb-approved-prop-pitcher-feature-materializer.service.ts
      - .github/workflows/mlb-pitcher-feature-query-optimization.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
