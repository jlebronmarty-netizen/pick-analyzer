name: MLB Official Pick boundary runtime hash

on:
  pull_request:
    paths:
      - 'scripts/mlb-data-02r-r2i-live-execution-interfaces.mjs'
      - '.github/workflows/mlb-official-pick-boundary-hash.yml'

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute normalized runtime hash
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib
          p=pathlib.Path('scripts/mlb-data-02r-r2i-live-execution-interfaces.mjs')
          b=p.read_text(encoding='utf-8').replace('\r\n','\n').encode()
          print('R2I_RUNTIME_SHA256='+hashlib.sha256(b).hexdigest())
          PY
