name: MLB Pitcher Outs O13.5 Line Surface Validate
on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/research/mlb_pitcher_outs_o13p5_line_surface_v1.json'
      - 'docs/research/MLB_PITCHER_OUTS_O13P5_LINE_SURFACE_V1.md'
      - 'scripts/research/mlb_pitcher_outs_o13p5_line_surface_v1.sql'
      - 'scripts/research/verify_mlb_pitcher_outs_o13p5_line_surface_v1.test.mjs'
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test scripts/research/verify_mlb_pitcher_outs_o13p5_line_surface_v1.test.mjs
