name: MLB Totals V24 Real ML Research

on:
  push:
    branches:
      - research/totals-2025-historical-backfill
    paths:
      - '.github/workflows/mlb-totals-v24-real-ml.yml'
      - 'src/app/api/research/mlb/totals-v24-dataset/route.ts'
      - 'scripts/research/train_mlb_totals_v24_ml.py'
      - 'docs/research/totals-v24-ml-request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-totals-v24-real-ml
  cancel-in-progress: false

env:
  REQUEST_PATH: docs/research/totals-v24-ml-request.json
  DATASET_PATH: /tmp/mlb_totals_v24_dataset.json
  OUTPUT_PATH: artifacts/research/mlb_totals_v24_real_ml_result.json
  VERCEL_ORG_ID: team_5NEeiCoWmTBO4kAkgKZwoQmN
  VERCEL_PROJECT_ID: prj_hmkAkzUTe3b7M7yedvshGl5L9rP7

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/totals-2025-historical-backfill
          fetch-depth: 0

      - name: Validate research-only request
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const request = JSON.parse(fs.readFileSync(process.env.REQUEST_PATH, 'utf8'))
          const checks = [
            [request.contract === 'MLB_TOTALS_V24_ML_REQUEST/1.0.0', 'contract mismatch'],
            [request.authorized === true, 'authorized must be true'],
            [request.branch === 'research/totals-2025-historical-backfill', 'branch mismatch'],
            [request.researchOnly === true, 'researchOnly must be true'],
            [request.market === 'total', 'market must be total'],
            [request.season === 2025, 'season must be 2025'],
            [request.external2026MayOpenOnlyAfterPreGate === true, '2026 gate required'],
            [request.use2026ForSelection === false, '2026 selection prohibited'],
            [request.expectedOddsApiCredits === 0, 'Odds API credits must be zero'],
            [request.providerCallsAllowed === false, 'provider calls prohibited'],
            [request.officialPicksWritesAllowed === false, 'Official Picks writes prohibited'],
            [request.apostarActivationAllowed === false, 'APOSTAR prohibited'],
            [request.productionPromotionAllowed === false, 'production promotion prohibited'],
            [request.rawDatasetMayBeCommitted === false, 'raw dataset commit prohibited'],
          ]
          const failures = checks.filter(([ok]) => !ok).map(([, msg]) => msg)
          if (failures.length) throw new Error('TOTALS_V24_REQUEST_INVALID: ' + failures.join('; '))
          console.log('PASS: V24 bounded research request validated.')
          NODE

      - name: Pull protected preview env and export V24 dataset from Supabase
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'MISSING_VERCEL_TOKEN'
            exit 1
          fi

          ENV_FILE="/tmp/v24-preview.env"
          trap 'rm -f "$ENV_FILE"' EXIT

          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

          npx --yes vercel@59.16.0 env pull "$ENV_FILE" \
            --environment=preview \
            --git-branch=research/totals-2025-historical-backfill \
            --token="$VERCEL_TOKEN"

          set -a
          source "$ENV_FILE"
          set +a

          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo 'MISSING_PREVIEW_SUPABASE_ENV'
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs')

          const baseUrl = process.env.NEXT_PUBLIC_SUPABASE_URL
          const serviceKey = process.env.SUPABASE_SERVICE_ROLE_KEY
          const outputPath = process.env.DATASET_PATH
          const table = 'mlb_totals_v24_ml_dataset_2025_v1'
          const pageSize = 1000
          const rows = []

          async function main() {
            for (let offset = 0; ; offset += pageSize) {
              const params = new URLSearchParams({
                select: '*',
                game_date: 'gte.2025-04-01',
                order: 'game_date.asc,game_pk.asc',
                limit: String(pageSize),
                offset: String(offset),
              })
              const endpoint = baseUrl.replace(/\/$/, '') + '/rest/v1/' + table + '?' + params.toString()
              const response = await fetch(endpoint, {
                headers: {
                  apikey: serviceKey,
                  Authorization: 'Bearer ' + serviceKey,
                  'Accept-Profile': 'public',
                },
              })
              if (!response.ok) {
                const detail = await response.text()
                throw new Error('SUPABASE_V24_EXPORT_HTTP_' + response.status + ':' + detail.slice(0, 500))
              }
              const page = await response.json()
              const bounded = page.filter(
                (row) => String(row.game_date) < '2025-09-01' &&
                         (row.close_over_label === 0 || row.close_over_label === 1),
              )
              rows.push(...bounded)
              if (page.length < pageSize) break
            }

            const payload = {
              contract: 'MLB_TOTALS_V24_ML_DATASET/1.0.0',
              researchOnly: true,
              branch: 'research/totals-2025-historical-backfill',
              sourceTable: table,
              period: { from: '2025-04-01', to: '2025-08-31' },
              target: 'close_over_label',
              forbiddenFeatureFields: [
                'total_runs','home_runs','away_runs','actual_winner','y_margin',
                'actual_offense_score','actual_contact_score',
                'actual_starter_vulnerability_score','actual_bullpen_vulnerability_score',
              ],
              officialPicksWrites: 0,
              apostarActivation: false,
              rowCount: rows.length,
              rows,
            }
            fs.writeFileSync(outputPath, JSON.stringify(payload))
            console.log(JSON.stringify({ rowCount: rows.length, sourceTable: table }, null, 2))
          }

          main().catch((error) => {
            console.error(error.message)
            process.exit(1)
          })
          NODE

          node <<'NODE'
          const fs = require('fs')
          const payload = JSON.parse(fs.readFileSync(process.env.DATASET_PATH, 'utf8'))
          const forbidden = new Set([
            'total_runs','home_runs','away_runs','actual_winner','y_margin',
            'actual_offense_score','actual_contact_score',
            'actual_starter_vulnerability_score','actual_bullpen_vulnerability_score',
          ])
          const checks = [
            [payload.contract === 'MLB_TOTALS_V24_ML_DATASET/1.0.0', 'dataset contract mismatch'],
            [payload.researchOnly === true, 'dataset must be research-only'],
            [payload.branch === 'research/totals-2025-historical-backfill', 'branch mismatch'],
            [payload.target === 'close_over_label', 'target mismatch'],
            [payload.officialPicksWrites === 0, 'Official Picks boundary violated'],
            [payload.apostarActivation === false, 'APOSTAR boundary violated'],
            [Number(payload.rowCount) > 1500, 'insufficient rows'],
            [Array.isArray(payload.rows), 'rows missing'],
          ]
          for (const row of payload.rows || []) {
            for (const key of forbidden) {
              if (Object.prototype.hasOwnProperty.call(row, key)) {
                throw new Error('FORBIDDEN_FIELD_PRESENT:' + key)
              }
            }
          }
          const failures = checks.filter(([ok]) => !ok).map(([, msg]) => msg)
          if (failures.length) throw new Error('TOTALS_V24_DATASET_INVALID: ' + failures.join('; '))
          console.log('PASS: protected V24 dataset exported and validated.')
          NODE

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded research dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'numpy>=2.0,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2'

      - name: Train V24 real ML candidates
        run: |
          python scripts/research/train_mlb_totals_v24_ml.py \
            --input "$DATASET_PATH" \
            --output "$OUTPUT_PATH"

      - name: Validate V24 result boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const result = JSON.parse(fs.readFileSync(process.env.OUTPUT_PATH, 'utf8'))
          const checks = [
            [result.contract === 'MLB_TOTALS_V24_REAL_ML_RESEARCH/1.0.0', 'result contract mismatch'],
            [result.research_only === true, 'result must be research-only'],
            [result.official_picks_writes === 0, 'Official Picks write boundary violated'],
            [result.apostar_activation === false, 'APOSTAR boundary violated'],
            [result.production_promotion === false, 'production promotion boundary violated'],
            [result.odds_api_credits_consumed === 0, 'Odds API credits must remain zero'],
            [result['2026_used_for_selection'] === false, '2026 contamination'],
          ]
          const failures = checks.filter(([ok]) => !ok).map(([, msg]) => msg)
          if (failures.length) throw new Error('TOTALS_V24_RESULT_INVALID: ' + failures.join('; '))
          console.log(JSON.stringify({
            status: result.status,
            modelsTried: result.models_tried,
            internalGateCandidateCount: result.internal_gate_candidate_count,
            selected: result.selected_candidate_before_pregate,
            pregate: result.pregate_metrics,
            external2026: result.external_2026_status,
          }, null, 2))
          NODE

      - name: Commit research result only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTPUT_PATH"
          if git diff --cached --quiet; then
            echo 'No V24 result changes to commit.'
            exit 0
          fi
          git commit -m 'research(totals): record V24 real ML result'
          git push origin HEAD:research/totals-2025-historical-backfill
