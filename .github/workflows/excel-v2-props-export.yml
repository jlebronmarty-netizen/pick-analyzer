name: Excel V2 MLB Props Export

on:
  push:
    branches:
      - excel-v2-live-odds-preview-20260915
    paths:
      - '.github/workflows/excel-v2-props-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-props:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download staged MLB props CSV
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            'https://ynuocvexviorgdjrfthw.supabase.co/functions/v1/temp-excel-v2-all-props-export?token=excelv2-props-export-20260915-93d7c4' \
            --output mlb-all-props-2026-09-15.csv
          python - <<'PY'
          import csv, json
          p='mlb-all-props-2026-09-15.csv'
          with open(p, newline='', encoding='utf-8') as f:
              rows=sum(1 for _ in csv.reader(f))-1
          if rows != 10965:
              raise SystemExit(f'expected 10965 rows, got {rows}')
          with open('mlb-props-meta.json','w',encoding='utf-8') as f:
              json.dump({'rows': rows, 'source':'supabase_staging_20260915'}, f, indent=2)
          print(json.dumps({'rows': rows}))
          PY

      - name: Upload props artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlb-all-props-2026-09-15
          path: |
            mlb-all-props-2026-09-15.csv
            mlb-props-meta.json
          if-no-files-found: error
          retention-days: 1
