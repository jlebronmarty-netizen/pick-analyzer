name: NHL prospective goalie as-of form safety

on:
  pull_request:
    paths:
      - 'src/lib/nhl-goalie-prior-form-asof-v7.mjs'
      - 'src/lib/nhl-late-v6-core.mjs'
      - 'src/services/nhl-late-v6-freeze-writer.service.ts'
      - 'src/services/nhl-late-v6-readiness.service.ts'
      - 'tests/nhl-goalie-prior-form-asof-v7.test.mjs'
      - '.github/workflows/nhl-goalie-prior-form-asof-v7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Goalie historical identity and existing V6 safety regressions
        run: node --test tests/nhl-goalie-prior-form-asof-v7.test.mjs tests/nhl-v6-late-probable-calibration.test.mjs tests/nhl-v6-paired-validation.test.mjs tests/nhl-exact-circa-market-research.test.mjs
      - name: TypeScript safety
        run: npx tsc --noEmit --pretty false
