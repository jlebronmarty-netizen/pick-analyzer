name: MLB HRRBI U1.5 forward shadow

on:
  push:
    branches:
      - research/hrrbi-u1p5-forward-v1-20260925
    paths:
      - contracts/MLB_BATTER_HRRBI_U1P5_FORWARD_SHADOW_V1.json
      - artifacts/research/mlb_hrrbi_u1p5_forward_targets_20260925.json
      - scripts/research/mlb_hrrbi_u1p5_forward_v1.mjs
      - scripts/research/verify_mlb_hrrbi_u1p5_forward_v1.test.mjs
      - docs/research/MLB_HRRBI_U1P5_FORWARD_SHADOW_V1.md
      - .github/workflows/mlb-hrrbi-u1p5-forward.yml

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/research/verify_mlb_hrrbi_u1p5_forward_v1.test.mjs
      - name: Evaluate frozen forward targets
        env:
          HRRBI_FORWARD_RESULT_PATH: /tmp/mlb_hrrbi_u1p5_forward_20260925.json
        run: node scripts/research/mlb_hrrbi_u1p5_forward_v1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mlb-hrrbi-u1p5-forward-20260925
          path: /tmp/mlb_hrrbi_u1p5_forward_20260925.json
          if-no-files-found: error
          retention-days: 7
