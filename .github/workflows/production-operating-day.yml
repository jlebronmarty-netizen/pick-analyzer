name: Production Operating Day Scheduler

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use true for observer-only validation; scheduled production runs use false"
        required: false
        default: "false"
  schedule:
    - cron: "7-57/10 * * * *"

concurrency:
  group: production-operating-day-writer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PICK_ANALYZER_BASE_URL: https://pick-analyzer.vercel.app
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - name: Call production operating-day scheduler
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing CRON_SECRET repository secret."
            exit 1
          fi

          echo "Dispatch type: ${GITHUB_EVENT_NAME}"
          echo "Commit SHA: ${GITHUB_SHA}"

          response_file="$(mktemp)"
          status_code="$(curl --show-error --silent --max-time 120 \
            --output "${response_file}" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${PICK_ANALYZER_BASE_URL%/}/api/cron/operating-day?dryRun=${DRY_RUN}")"

          echo "Operating-day runtime HTTP ${status_code}"
          head -c 4000 "${response_file}"
          echo

          if [ "${status_code}" -lt 200 ] || [ "${status_code}" -ge 300 ]; then
            exit 1
          fi

          node - "${response_file}" <<'NODE'
          const fs = require('fs')
          const file = process.argv[2]
          const text = fs.readFileSync(file, 'utf8')
          let body
          try {
            body = JSON.parse(text)
          } catch (error) {
            console.error(`Operating-day response was not valid JSON: ${error.message}`)
            process.exit(1)
          }

          const failedStatuses = new Set([
            'BUDGET_BLOCKED',
            'BLOCKED',
            'MISSED_REFRESH',
            'FAILED_RETRYABLE',
            'configuration_error',
            'provider_error',
            'partial',
            'quota_blocked',
          ])
          const steps = Array.isArray(body.steps) ? body.steps : []
          const appInvocationId = steps.map((step) => step && step.executionRunId).find(Boolean)
          const writes = Number(body.writes ?? body.remoteMutationsMade ?? 0)
          const heartbeat = body.schedulerHeartbeat && body.schedulerHeartbeat.success === true

          if (body.success !== true) {
            console.error('Operating-day response success was not true.')
            process.exit(1)
          }
          if (failedStatuses.has(String(body.status ?? ''))) {
            console.error(`Operating-day response status is not a successful scheduler contract: ${body.status}`)
            process.exit(1)
          }
          if (!body.requestId) {
            console.error('Operating-day response did not include requestId.')
            process.exit(1)
          }
          if (!Object.prototype.hasOwnProperty.call(body, 'selectedAction')) {
            console.error('Operating-day response did not include selectedAction.')
            process.exit(1)
          }
          if (!appInvocationId) {
            console.error('Operating-day response did not include an adaptive executionRunId.')
            process.exit(1)
          }
          if (writes === 0 && !heartbeat) {
            console.error('Operating-day no-write success did not include scheduler heartbeat evidence.')
            process.exit(1)
          }

          console.log(`Validated operating-day response: requestId=${body.requestId} appInvocationId=${appInvocationId} selectedAction=${body.selectedAction} status=${body.status}`)
          NODE
