name: MLB Pitcher Hits Allowed line-surface research

on:
  push:
    branches:
      - research/batter-line-surface-closeouts-v1-20260922
    paths:
      - scripts/research/mlb_pitcher_hits_allowed_line_surface_v1.py
      - .github/workflows/mlb-pitcher-hits-allowed-line-surface-research.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/research/mlb_pitcher_hits_allowed_line_surface_v1.py
      - .github/workflows/mlb-pitcher-hits-allowed-line-surface-research.yml

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run exact Pitcher Hits Allowed replay and 2025 development search
        run: python3 scripts/research/mlb_pitcher_hits_allowed_line_surface_v1.py
      - name: Upload research result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-pitcher-hits-allowed-line-surface-v1
          path: /tmp/mlb_pitcher_hits_allowed_line_surface_v1.json
          if-no-files-found: ignore
          retention-days: 7
