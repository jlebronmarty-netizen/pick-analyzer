name: MLB Market-First forward settlement

on:
  push:
    branches:
      - research/market-first-forward-ledger-v1-20260925
    paths:
      - artifacts/research/mlb_market_first_forward_ledger_v1_20260925.json
      - scripts/research/mlb_market_first_forward_settlement_v1.mjs
      - scripts/research/verify_mlb_market_first_forward_ledger_v1.test.mjs
      - docs/research/MLB_MARKET_FIRST_FORWARD_LEDGER_V1.md
      - .github/workflows/mlb-market-first-forward-settlement.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/research/verify_mlb_market_first_forward_ledger_v1.test.mjs
      - name: Read forward settlement
        env:
          MLB_FORWARD_SETTLEMENT_OUT: /tmp/mlb_market_first_forward_settlement_20260925.json
        run: node scripts/research/mlb_market_first_forward_settlement_v1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mlb-market-first-forward-settlement-20260925
          path: /tmp/mlb_market_first_forward_settlement_20260925.json
          if-no-files-found: error
          retention-days: 14
