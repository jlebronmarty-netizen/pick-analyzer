name: College archived evaluation safety

on:
  pull_request:
    paths:
      - 'src/lib/ncaab-source-lifecycle.mjs'
      - 'src/lib/ncaab-live.ts'
      - 'src/lib/college-score-accuracy.mjs'
      - 'src/lib/college-numeric-evaluation.mjs'
      - 'src/services/ncaab-daily.service.ts'
      - 'src/services/ncaaf-causal-learning.service.ts'
      - 'src/components/dashboard/NcaabDashboard.tsx'
      - 'src/app/edge-lab/ncaaf-panel.jsx'
      - 'src/app/ncaaf-learning/page.tsx'
      - 'tests/ncaab-source-lifecycle.test.mjs'
      - 'tests/college-score-accuracy.test.mjs'
      - 'tests/college-numeric-evaluation.test.mjs'
      - 'tests/dashboard-multisport/ncaab-daily.test.mjs'
      - '.github/workflows/ncaab-archived-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: College archived evaluation regression
        run: node --test tests/ncaab-source-lifecycle.test.mjs tests/college-score-accuracy.test.mjs tests/college-numeric-evaluation.test.mjs
      - name: Dashboard multisport regression
        run: npm run test:dashboard-multisport
      - name: TypeScript verification
        run: npx tsc --noEmit --pretty false
