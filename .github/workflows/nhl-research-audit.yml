name: NHL stored archive research audit

on:
  pull_request:
    paths:
      - 'src/lib/nhl-research-*.mjs'
      - 'src/lib/nhl-exact-circa-market-research.mjs'
      - 'src/lib/nhl-goalie-prior-form-asof-v7.mjs'
      - 'src/lib/nhl-manual-features.mjs'
      - 'src/services/nhl-research-audit.service.ts'
      - 'src/services/nhl-manual-features.service.ts'
      - 'src/app/api/nhl/research-audit/**'
      - 'src/app/api/nhl/manual-features/**'
      - 'src/components/dashboard/NhlResearchAuditPanel.tsx'
      - 'src/components/dashboard/NhlManualFeaturesPanel.tsx'
      - 'src/types/nhl-manual-features.ts'
      - 'src/components/dashboard/NhlDashboard.tsx'
      - 'tests/nhl-*.test.mjs'
      - 'research/nhl-sheet-tracker/**'
      - 'supabase/migrations/*_nhl_sheet_tracker_review.sql'
      - 'tests/nhl-sheet-v1.postgres.mjs'
      - 'tests/fixtures/nhl-*.json'
      - 'tests/fixtures/nhl-manual-features.mjs'
      - 'tests/dashboard-multisport/nhl-research-audit-ui.test.mjs'
      - 'tests/dashboard-multisport/nhl-manual-features-ui.test.mjs'
      - 'tests/*manual*feature*.py'
      - 'scripts/nhl-research-audit.mjs'
      - 'scripts/nhl-manual-feature*'
      - 'supabase/migrations/*_nhl_manual_feature_snapshots_v1.sql'
      - '.github/workflows/nhl-research-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      NODE_OPTIONS: --max-old-space-size=4096
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:55438:5432'
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: NHL chronology, quality and contract regressions
        run: node --test tests/nhl-*.test.mjs
      - name: NHL dashboard and empty-state checks
        run: node --loader ./tests/dashboard-multisport/tsx-loader.mjs --test tests/dashboard-multisport/nhl*.test.mjs
      - name: Shared feature SQL renderer contract and injection checks
        run: python3 -m unittest discover -s tests -p 'test_nhl_manual_feature_sql.py' -v
      - name: Isolated NHL ledger under Supabase-style privileges
        run: |
          npm install --prefix "$RUNNER_TEMP/sheet-pg" --ignore-scripts --no-audit --no-fund pg@8.16.3
          NBA_SHEET_TEST_PG_MODULE="$RUNNER_TEMP/sheet-pg/node_modules/pg/lib/index.js" node tests/nhl-sheet-v1.postgres.mjs
      - name: Full application build
        run: npm run build
