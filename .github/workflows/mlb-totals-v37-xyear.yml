name: MLB Totals V37 Cross-Year Rolling 2025

on:
  push:
    branches: [research/totals-2025-historical-backfill]
    paths:
      - '.github/workflows/mlb-totals-v37-xyear.yml'
      - 'docs/research/totals-v37-xyear-request.json'
      - 'scripts/research/train_mlb_totals_v37_xyear.py'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: mlb-totals-v37-xyear
  cancel-in-progress: false

env:
  REQUEST_PATH: docs/research/totals-v37-xyear-request.json
  RESULT_PATH: artifacts/research/mlb_totals_v37_rolling_2025_result.json
  FREEZE_PATH: artifacts/research/mlb_totals_v37_frozen_candidate.json

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/totals-2025-historical-backfill
          fetch-depth: 0

      - name: Validate V37 request
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.REQUEST_PATH,'utf8'))
          const c=[
            [r.contract==='MLB_TOTALS_V37_ROLLING_2025_REQUEST/1.0.0','contract'],
            [r.authorized===true,'authorized'],[r.researchOnly===true,'research'],
            [r.crossYearParityVerified===true,'parity'],[r.developmentSeason===2025,'2025'],
            [r.externalSeason===2026,'2026'],[r.openExternal2026InThisRun===false,'external closed'],
            [r.useExternal2026ForSelection===false,'selection'],[r.expectedOddsApiCredits===0,'credits'],
            [r.providerCallsAllowed===false,'providers'],[r.officialPicksWritesAllowed===false,'official'],
            [r.apostarActivationAllowed===false,'apostar'],[r.productionPromotionAllowed===false,'production']
          ];const bad=c.filter(([x])=>!x).map(([,n])=>n);if(bad.length)throw new Error('V37_REQUEST_INVALID:'+bad.join(','))
          console.log('PASS V37 request')
          NODE

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned V37 dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'catboost==1.2.10' 'numpy>=2.0,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'requests>=2.32,<3'

      - name: Mint GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token=await core.getIDToken('supabase-v37')
            core.setSecret(token)
            core.setOutput('token',token)

      - name: Evaluate V37 and freeze 2025 candidate
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: python scripts/research/train_mlb_totals_v37_xyear.py

      - name: Validate V37 boundaries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.RESULT_PATH,'utf8'));const f=JSON.parse(fs.readFileSync(process.env.FREEZE_PATH,'utf8'))
          const c=[
            [r.contract==='MLB_TOTALS_V37_ROLLING_2025_RESULT/1.0.0','result'],
            [r.selected_using_2025_only===true,'2025 only'],[r.external_2026_opened===false,'2026 closed'],
            [r.cross_year_feature_parity_verified===true,'parity'],[r.official_picks_writes===0,'official'],
            [r.apostar_activation===false,'apostar'],[r.production_promotion===false,'production'],
            [r.odds_api_historical_credits_consumed===0,'credits'],
            [f.contract==='MLB_TOTALS_V37_FROZEN_CANDIDATE/1.0.0','freeze'],[f.frozen===true,'frozen'],
            [f.external_2026_opened===false,'freeze 2026']
          ];const bad=c.filter(([x])=>!x).map(([,n])=>n);if(bad.length)throw new Error('V37_BOUNDARY:'+bad.join(','))
          console.log(JSON.stringify({state:r.market_closeout_state,selected:r.selected_candidate,features:r.feature_count},null,2))
          NODE

      - name: Commit V37 artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH" "$FREEZE_PATH"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(totals): freeze V37 cross-year candidate'
          git pull --rebase origin research/totals-2025-historical-backfill
          git push origin HEAD:research/totals-2025-historical-backfill

      - uses: actions/upload-artifact@v4
        with:
          name: mlb-totals-v37
          path: |
            artifacts/research/mlb_totals_v37_rolling_2025_result.json
            artifacts/research/mlb_totals_v37_frozen_candidate.json
          retention-days: 14
          if-no-files-found: error
