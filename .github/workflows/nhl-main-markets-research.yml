name: NHL Main Markets Forward Research
on:
  pull_request:
    paths:
      - 'src/lib/nhl-main-market-*.mjs'
      - 'src/services/nhl-main-market-*.ts'
      - 'src/app/api/nhl/main-markets-research/**'
      - 'src/app/api/cron/nhl-free/**'
      - 'tests/nhl-main-market-*.test.mjs'
      - '.github/workflows/nhl-main-markets-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: NHL forward-only features, historical budgets, causal and audit regression
        run: node --test tests/nhl-main-market-*.test.mjs tests/nhl-causal-learning-v1-v3.test.mjs tests/nhl-production-audit-20261113.test.mjs
      - name: Dependencies
        run: npm ci --no-audit --no-fund
      - name: Strict TypeScript
        run: npx tsc --noEmit --pretty false
