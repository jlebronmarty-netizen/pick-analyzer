name: PA12 Pitcher ER Training Readiness Validate

on:
  push:
    branches:
      - 'research/pa12-er-training-readiness-v1'
    paths:
      - 'src/services/shared-mlb-pitcher-er-outcomes.service.ts'
      - 'src/services/mlb-pitcher-earned-runs-training-readiness.service.ts'
      - 'src/app/api/mlb/research/pitcher-earned-runs/training-readiness/route.ts'
      - 'scripts/pa12-er-training-readiness-contract-check.mjs'
      - 'docs/CERTIFICATION/PA12_PITCHER_ER_TRAINING_READINESS_V1.md'
      - 'docs/CERTIFICATION/PA13_PITCHER_ER_PRICING_AUDIT_2026-09-15.md'
      - '.github/workflows/pa12-er-training-readiness-validate.yml'
  pull_request:
    paths:
      - 'src/services/shared-mlb-pitcher-er-outcomes.service.ts'
      - 'src/services/mlb-pitcher-earned-runs-training-readiness.service.ts'
      - 'src/app/api/mlb/research/pitcher-earned-runs/training-readiness/route.ts'
      - 'scripts/pa12-er-training-readiness-contract-check.mjs'
      - 'docs/CERTIFICATION/PA12_PITCHER_ER_TRAINING_READINESS_V1.md'
      - 'docs/CERTIFICATION/PA13_PITCHER_ER_PRICING_AUDIT_2026-09-15.md'
      - '.github/workflows/pa12-er-training-readiness-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: PA12 exact ER outcome contract checks
        run: node --loader ./scripts/local-ts-loader.mjs scripts/pa12-pitcher-er-outcome-contract-check.mjs
      - name: PA12 training-readiness static contract checks
        run: node scripts/pa12-er-training-readiness-contract-check.mjs
      - name: Production TypeScript build
        run: npm run build
