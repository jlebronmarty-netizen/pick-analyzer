name: PA14 V5 MLB type normalization fix

on:
  push:
    branches:
      - pa14-v5-daily-history-ingestion-20260914
    paths:
      - .github/workflows/pa14-v5-opponent-statcast-query-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pa14-v5-daily-history-ingestion-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply MLB type normalization patch
        run: python scripts/pa14-v5-indexed-statcast-patch.py
      - name: Commit branch-only fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/pa14-v2-real-evidence.service.ts
          git diff --cached --check
          git diff --cached --quiet && exit 1 || true
          git commit -m 'fix: normalize MLB official pitch types for PA14 V2'
          git push origin HEAD:pa14-v5-daily-history-ingestion-20260914
