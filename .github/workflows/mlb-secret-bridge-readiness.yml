name: MLB secret bridge readiness

on:
  push:
    branches:
      - research/period-team-threshold-classifier-v1-20260921
    paths:
      - .github/workflows/mlb-secret-bridge-readiness.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Presence-only audit
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const keys=['BALLDONTLIE_API_KEY','VERCEL_TOKEN','VERCEL_ORG_ID','VERCEL_PROJECT_ID']
          const out={}
          for(const k of keys) out[k]=Boolean((process.env[k]||'').trim())
          console.log(JSON.stringify(out,null,2))
          NODE
