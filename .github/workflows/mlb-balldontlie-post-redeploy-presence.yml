name: MLB BALLDONTLIE post-redeploy presence

on:
  push:
    branches:
      - research/vercel-cost-guard-test-20260923
    paths:
      - .github/workflows/mlb-balldontlie-post-redeploy-presence.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      ENDPOINT: https://pick-analyzer.vercel.app/api/research/pa14/balldontlie-key-status
    steps:
      - name: Presence-only read
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CRON_SECRET:-}"
          curl -fsS --connect-timeout 10 --max-time 30             -H "x-pick-analyzer-cron-secret: ${CRON_SECRET}"             "${ENDPOINT}"             -o balldontlie-key-status.json
          node <<'NODE'
          const fs=require('fs')
          const p=JSON.parse(fs.readFileSync('balldontlie-key-status.json','utf8'))
          if(p.ok!==true) throw new Error('route failed')
          if(p.provider!=='balldontlie') throw new Error('provider mismatch')
          if(p.providerCallsMade!==0) throw new Error('provider call forbidden')
          if(p.secretValueExposed!==false) throw new Error('secret exposure')
          console.log(JSON.stringify({
            provider:p.provider,
            environment:p.environment,
            configured:p.configured,
            providerCallsMade:p.providerCallsMade,
            secretValueExposed:p.secretValueExposed
          },null,2))
          NODE
