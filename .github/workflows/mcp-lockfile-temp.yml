name: MCP Lockfile Temp

on:
  push:
    branches:
      - feature/mlb-mcp-readonly-v1
    paths:
      - package.json
      - .github/workflows/mcp-lockfile-temp.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mlb-mcp-readonly-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile is synchronized
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(mlb): synchronize MCP package lock"
          git push origin HEAD:feature/mlb-mcp-readonly-v1
