name: TT recovery fairness and backlog status

on:
  pull_request:
    paths:
      - 'src/lib/edge-lab/tt-pending-recovery.mjs'
      - 'src/services/edge-lab-multi.service.mjs'
      - 'tests/edge-lab-multi.test.mjs'
      - 'tests/tt-recovery-priority-status.test.mjs'
      - '.github/workflows/tt-recovery-fairness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Core TT settlement regression and recovery tests
        run: node --test tests/edge-lab-multi.test.mjs tests/tt-recovery-priority-status.test.mjs tests/tt-prematch-scope-regression.test.mjs
      - name: Dashboard multisport regression
        run: npm run test:dashboard-multisport
      - name: TypeScript verification
        run: npx tsc --noEmit --pretty false
